# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (mathlib-initiative format) with the Palomar registry additions
# (responsible maintainers, classification, sources with relationships).
version: "v0.4"

project:
  name: "Hamilton cycles in Cayley graphs of polylogarithmic degree"
  description: >-
    A complete Lean 4 / Mathlib formalization of the following theorem: there
    are absolute constants C, n0 > 0 such that every connected Cayley graph
    Cay(G, S) on n >= n0 vertices whose degree d = |S| is at least
    C (log n)^13 / log log n contains a Hamilton cycle
    (Lovasz.hamiltonian_of_polylog_degree). Here G is a finite group, S is a
    connection set (S = S^-1 and 1 not in S, so the graph is |S|-regular), log
    is the natural logarithm, and connectivity is equivalent to S generating G.
    The theorem is a case of the Lovász conjecture (every connected
    vertex-transitive graph has a Hamilton path) in its Cayley-graph form (every
    connected Cayley graph on at least three vertices is Hamiltonian). For
    arbitrary connected Cayley graphs the previously published degree
    thresholds were linear degree (Christofides, Hladký and Máthé, 2014) and
    degree at least n^(1-c) (Bedert, Draganić, Müyesser and Pavez-Signé, 2026).
    The proof follows the source manuscript: it extracts a connected bipartite
    template with spectral gap of order (log n)^-2, allocates the vertices to
    weighted translates of the template by signed rounding (a robust signed
    integrality theorem derived from the capacitated b-matching polytope, swap
    rounding, and a trace-exponential matrix concentration bound), connects the
    pieces by a sparse matching chosen by mutual nominations and a signed
    circulation, absorbs the outside matching inside every piece with Hamilton
    routers built from even-cycle comparators, and merges cycles. Every lemma of
    the manuscript is proved in the repository, as are the classical results it
    uses without proof (normalized Cheeger inequality, Haxell's hypergraph
    matching theorem, the b-matching polytope, Watkins's connectivity bound, the
    Nash-Williams–Tutte tree-packing theorem, Hoffman's circulation criterion,
    scalar Chernoff bounds); Hall's theorem is taken from Mathlib, and matrix
    Bernstein is avoided by deriving the one lemma that used it from the
    manuscript's own concentration bound. The source manuscript is an unpublished research draft
    that describes its own proof as not independently verified; this
    formalization is, to the maintainer's knowledge, the first verification of
    the theorem. The proved theorem has no sorry and depends only on propext,
    Classical.choice and Quot.sound.
  # The human who directed the formalization and takes responsibility for it (see
  # automation.notes); the authors of the source manuscript are recorded in sources[].
  authors:
    - "Shengtong Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Shengtong Zhang"

# `repository` is omitted: this repository is the substantive proof development,
# not a thin Comparator wrapper.

classification:
  arxiv: [math.CO]
  msc2020: ["05C45", "05C25", "05C48", "05C50", "05C70", "05C80"]

sources:
  - title: "Hamilton cycles in Cayley graphs of polylogarithmic degree"
    authors:
      - "Domagoj Bradač"
      - "Matija Bucić"
      - "Micha Christoph"
      - "Zach Hunter"
      - "Oliver Janzer"
      - "Alp Müyesser"
    contributors:
      - name: "GPT 6 Pro (OpenAI)"
        role: "prepared the draft, with significant input from the authors"
    id: "docs/Polylog_Cayley.pdf (this repository, at the submitted commit)"
    type: paper
    location: "https://github.com/ShengtongZhang-alt/lovasz-opus/blob/main/docs/Polylog_Cayley.pdf"
    relationship: formalizes
    note: >-
      Unpublished research draft dated 25 September 2026 (26 pages), included
      in the repository as docs/Polylog_Cayley.pdf. The PDF itself carries no
      author line; the authors and the account of its preparation are as
      stated by the authors in README.md: the draft was prepared by GPT 6 Pro
      (OpenAI) with significant input from the authors, including several
      unpublished human manuscripts identified in its bibliography, and the
      authors are working on a more readable exposition of the proof. The
      maintainer, who is not an author, supplied the author list. The draft
      presents Theorem 1.1 as a "proposed theorem" and states that its proof
      is a consolidated proposed proof, not an independently verified
      theorem; it adapts the local absorption argument of an unpublished
      manuscript of Müyesser (listed below) and consolidates two preceding
      unpublished drafts that it cites (listed below; not included here). The
      formalization proves Theorem 1.1 and, as a lemma DAG recorded in
      docs/BLUEPRINT.md, every lemma of Sections 2–7: Lemmas 2.1–2.5, 3.3–3.8,
      Theorem 3.2, Lemmas 4.1–4.4, 5.1–5.2, Proposition 5.3, Lemmas 6.2–6.4,
      Proposition 6.1, and the parameter check of Section 7. No gap in the
      manuscript's argument was found; the points where the Lean proof takes a
      different route from the text are listed at the end of
      docs/BLUEPRINT.md.
    license: unknown
  - title: "Problem 11"
    authors: ["László Lovász"]
    type: other
    location: >-
      In: Combinatorial Structures and Their Applications (Proc. Calgary
      Internat. Conf., Calgary, Alberta, 1969), Gordon and Breach, New York,
      1970, p. 497
    relationship: background
    note: >-
      Lovász's question whether every connected vertex-transitive graph has a
      Hamilton path. The Cayley-graph form asks whether every connected Cayley
      graph on at least three vertices is Hamiltonian; Theorem 1.1 settles it
      for degree at least C (log n)^13 / log log n and large n.
  - title: "Cayley color groups and Hamilton lines"
    authors: ["E. Rapaport-Strasser"]
    type: paper
    location: "Scripta Math. 24 (1959), 51–58"
    relationship: background
    note: >-
      The origin of the question for Cayley graphs, as attributed by
      Bradač–Janzer (arXiv:2605.15043).
  - title: "Hamilton cycles in dense vertex-transitive graphs"
    authors: ["Demetres Christofides", "Jan Hladký", "András Máthé"]
    id: "doi:10.1016/j.jctb.2014.05.001"
    type: paper
    location: "https://doi.org/10.1016/j.jctb.2014.05.001"
    relationship: background
    note: >-
      J. Combin. Theory Ser. B 109 (2014), 34–72 (arXiv:1008.2193). Every
      large connected vertex-transitive graph of linear degree is Hamiltonian.
  - title: "The Lovász conjecture holds for moderately dense Cayley graphs"
    authors: ["Benjamin Bedert", "Nemanja Draganić", "Alp Müyesser", "Matías Pavez-Signé"]
    id: "arXiv:2603.08675"
    type: paper
    location: "https://arxiv.org/abs/2603.08675"
    relationship: background
    note: >-
      Every large connected n-vertex Cayley graph of degree at least n^(1-c) is
      Hamiltonian, for an absolute constant c > 0. This is the strongest
      previously published degree threshold for arbitrary connected Cayley
      graphs known to the maintainer; Theorem 1.1 lowers it to
      C (log n)^13 / log log n.
  - title: "Hamiltonicity of regular sublinear expanders"
    authors: ["Domagoj Bradač", "Oliver Janzer"]
    id: "arXiv:2605.15043"
    type: paper
    location: "https://arxiv.org/abs/2605.15043"
    relationship: background
    note: >-
      Every n-vertex d-regular gamma-expander with d >= (gamma^-1 log n)^K that
      is bipartite or gamma-far from bipartite is Hamiltonian; applications
      include robust (edge-percolated) versions of the Bedert–Draganić–
      Müyesser–Pavez-Signé theorem for Cayley graphs of degree n^(1-c). It does
      not cover arbitrary Cayley graphs of polylogarithmic degree, which need
      not be expanders.
  - title: "Thinning and sprinkling: from robust sampling to almost Hamiltonicity"
    authors: ["Micha Christoph", "Zach Hunter", "Benny Sudakov"]
    id: "arXiv:2609.30165"
    type: paper
    location: "https://arxiv.org/abs/2609.30165"
    relationship: background
    note: >-
      Posted 24 September 2026. Among other results, connected
      vertex-transitive graphs of polylogarithmic degree contain a cycle of
      length (1 - o(1)) n. That is almost Hamiltonicity, a weaker conclusion
      than Theorem 1.1's Hamilton cycle, for a broader class of graphs; the
      source manuscript does not cite it.
  - title: "Hamiltonicity of expanders: optimal bounds and applications"
    authors: ["Nemanja Draganić", "Richard Montgomery", "David Munhá Correia", "Alexey Pokrovskiy", "Benny Sudakov"]
    id: "arXiv:2402.06603"
    type: paper
    location: "https://arxiv.org/abs/2402.06603"
    relationship: background
    note: >-
      C-expanders are Hamiltonian; in particular a Cayley graph with a
      uniformly random generating set of size at least C log n is Hamiltonian
      with high probability. Theorem 1.1 concerns every connected Cayley graph
      of the stated degree, not random generating sets.
  - title: "Towards the Lovász conjecture via sublinear expanders"
    authors: ["Matija Bucić", "Micha Christoph", "Alexey Pokrovskiy", "Raphael Steiner"]
    id: "arXiv:2606.09742"
    type: paper
    location: "https://arxiv.org/abs/2606.09742"
    relationship: background
    note: >-
      Long cycles in connected vertex-transitive graphs of arbitrary degree via
      sublinear expanders; context for the Lovász conjecture.
  - title: "Hamiltonicity of mildly pseudorandom regular graphs"
    authors: ["Alp Müyesser"]
    type: other
    location: "Unpublished manuscript (supplied manuscript cited as [6] by the source draft); not publicly available"
    relationship: background
    note: >-
      The source draft states that its local absorption argument (Section 3) is
      an adaptation of this manuscript and that neither the local statement nor
      the Cayley degree bound is asserted there. The formalization follows the
      source draft's version and did not consult this manuscript.
  - title: "Hamilton cycles in bipartite Cayley graphs: a proof draft via balanced allocation"
    type: other
    location: "Unpublished research draft, 2026 (cited as [9] by the source draft); not publicly available"
    relationship: background
    note: >-
      A preceding draft that the source consolidates; the source states that
      its signed allocation machinery originates in the earlier drafts,
      including this one, and is proved in the source rather than assumed. The
      formalization follows the source and did not consult this draft.
  - title: "A candidate logarithmic exponent of thirteen: weighted allocation and Hamilton routers"
    type: other
    location: "Unpublished research draft, 2026 (cited as [10] by the source draft); not publicly available"
    relationship: background
    note: >-
      A preceding draft whose exponent-13 argument the source consolidates.
      The formalization follows the source and did not consult this draft.
  - title: "Connectivity of transitive graphs"
    authors: ["Mark E. Watkins"]
    id: "doi:10.1016/S0021-9800(70)80005-9"
    type: paper
    location: "https://doi.org/10.1016/S0021-9800(70)80005-9"
    relationship: background
    note: >-
      J. Combinatorial Theory 8 (1970), 23–29. The weak form "vertex
