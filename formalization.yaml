# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 (mathlib-initiative format) with the Palomar registry additions
# (responsible maintainers, classification, sources with relationships).
version: "v0.4"

project:
  name: "Hamilton cycles in Cayley graphs of polylogarithmic degree"
  description: >-
    A complete Lean 4 / Mathlib formalization of the following theorem: there
    are absolute constants C, n0 > 0 such that every connected Cayley graph
    Cay(G, S) on n >= n0 vertices whose degree d = |S| is at least
    C (log n)^13 / log log n contains a Hamilton cycle
    (Lovasz.hamiltonian_of_polylog_degree). Here G is a finite group, S is a
    connection set (S = S^-1 and 1 not in S, so the graph is |S|-regular), log
    is the natural logarithm, and connectivity is equivalent to S generating G.
    The theorem is a case of the Lovász conjecture (every connected
    vertex-transitive graph has a Hamilton path) in its Cayley-graph form (every
    connected Cayley graph on at least three vertices is Hamiltonian). For
    arbitrary connected Cayley graphs the previously published degree
    thresholds were linear degree (Christofides, Hladký and Máthé, 2014) and
    degree at least n^(1-c) (Bedert, Draganić, Müyesser and Pavez-Signé, 2026).
    The proof follows the source manuscript: it extracts a connected bipartite
    template with spectral gap of order (log n)^-2, allocates the vertices to
    weighted translates of the template by signed rounding (a robust signed
    integrality theorem derived from the capacitated b-matching polytope, swap
    rounding, and a trace-exponential matrix concentration bound), connects the
    pieces by a sparse matching chosen by mutual nominations and a signed
    circulation, absorbs the outside matching inside every piece with Hamilton
    routers built from even-cycle comparators, and merges cycles. Every lemma of
    the manuscript is proved in the repository, as are the classical results it
    uses without proof (normalized Cheeger inequality, Haxell's hypergraph
    matching theorem, the b-matching polytope, Watkins's connectivity bound, the
    Nash-Williams–Tutte tree-packing theorem, Hoffman's circulation criterion,
    scalar Chernoff bounds); Hall's theorem is taken from Mathlib, and matrix
    Bernstein is avoided by deriving the one lemma that used it from the
    manuscript's own concentration bound. The source manuscript is an unpublished research draft
    that describes its own proof as not independently verified; this
    formalization is, to the maintainer's knowledge, the first verification of
    the theorem. The proved theorem has no sorry and depends only on propext,
    Classical.choice and Quot.sound.
  # The human who directed the formalization and takes responsibility for it (see
  # automation.notes); the authors of the source manuscript are recorded in sources[].
  authors:
    - "Shengtong Zhang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Shengtong Zhang"

# `repository` is omitted: this repository is the substantive proof development,
# not a thin Comparator wrapper.

classification:
  arxiv: [math.CO]
  msc2020: ["05C45", "05C25", "05C48", "05C50", "05C70", "05C80"]

sources:
  - title: "Hamilton cycles in Cayley graphs of polylogarithmic degree"
    authors:
      - "Matija Bucić"
      - "Micha Christoph"
      - "Domagoj Bradač"
      - "Oliver Janzer"
      - "Alp Müyesser"
      - "Zach Hunter"
    contributors:
      - name: "GPT 6 Astra (OpenAI)"
        role: "generated the manuscript in collaboration with the authors"
    id: "docs/Polylog_Cayley.pdf (this repository, at the submitted commit)"
    type: paper
    location: "https://github.com/ShengtongZhang-alt/lovasz-opus/blob/main/docs/Polylog_Cayley.pdf"
    relationship: formalizes
    note: >-
      Unpublished research draft dated 25 September 2026 (26 pages), included
      in the repository as docs/Polylog_Cayley.pdf. The PDF itself carries no
      author line; the author list is as given by the maintainer, who is not an
      author. The manuscript was generated by GPT 6 Astra (OpenAI) in
      collaboration with the authors. It presents Theorem 1.1 as a "proposed
      theorem" and states that its proof is a consolidated proposed proof, not
      an independently verified theorem; it adapts the local absorption
      argument of an unpublished manuscript of Müyesser (listed below) and
      consolidates two preceding drafts that it cites but that are not
      included here. The formalization proves Theorem 1.1 and, as a lemma DAG
      recorded in docs/BLUEPRINT.md, every lemma of Sections 2–7: Lemmas 2.1–2.5,
      3.3–3.8, Theorem 3.2, Lemmas 4.1–4.4, 5.1–5.2, Proposition 5.3, Lemmas
      6.2–6.4, Proposition 6.1, and the parameter check of Section 7. No gap in
      the manuscript's argument was found; the points where the Lean proof
      takes a different route from the text are listed at the end of
      docs/BLUEPRINT.md.
    license: unknown
  - title: "Problem 11"
    authors: ["László Lovász"]
    type: other
    location: >-
      In: Combinatorial Structures and their Applications (Proc. Calgary
      Internat. Conf., Calgary, 1969), Gordon and Breach, New York, 1970
    relationship: background
    note: >-
      Lovász's question whether every connected vertex-transitive graph has a
      Hamilton path. The Cayley-graph form asks whether every connected Cayley
      graph on at least three vertices is Hamiltonian; Theorem 1.1 settles it
      for degree at least C (log n)^13 / log log n and large n.
  - title: "Hamilton cycles in dense vertex-transitive graphs"
    authors: ["Demetres Christofides", "Jan Hladký", "András Máthé"]
    id: "doi:10.1016/j.jctb.2014.05.001"
    type: paper
    location: "https://doi.org/10.1016/j.jctb.2014.05.001"
    relationship: background
    note: >-
      J. Combin. Theory Ser. B 109 (2014), 34–72 (arXiv:1008.2193). Every
      large connected vertex-transitive graph of linear degree is Hamiltonian.
  - title: "The Lovász conjecture holds for moderately dense Cayley graphs"
    authors: ["Benjamin Bedert", "Nemanja Draganić", "Alp Müyesser", "Matías Pavez-Signé"]
    id: "arXiv:2603.08675"
    type: paper
    location: "https://arxiv.org/abs/2603.08675"
    relationship: background
    note: >-
      Every large connected n-vertex Cayley graph of degree at least n^(1-c) is
      Hamiltonian, for an absolute constant c > 0. This is the strongest
      previously published degree threshold for arbitrary connected Cayley
      graphs known to the maintainer; Theorem 1.1 lowers it to
      C (log n)^13 / log log n.
  - title: "Hamiltonicity of regular sublinear expanders"
    authors: ["Domagoj Bradač", "Oliver Janzer"]
    id: "arXiv:2605.15043"
    type: paper
    location: "https://arxiv.org/abs/2605.15043"
    relationship: background
    note: >-
      Every n-vertex d-regular gamma-expander with d >= (gamma^-1 log n)^K that
      is bipartite or gamma-far from bipartite is Hamiltonian; applications
      include robust (edge-percolated) versions of the Bedert–Draganić–
      Müyesser–Pavez-Signé theorem for Cayley graphs of degree n^(1-c). It does
      not cover arbitrary Cayley graphs of polylogarithmic degree, which need
      not be expanders.
  - title: "Hamiltonicity of expanders: optimal bounds and applications"
    authors: ["Nemanja Draganić", "Richard Montgomery", "David Munhá Correia", "Alexey Pokrovskiy", "Benny Sudakov"]
    id: "arXiv:2402.06603"
    type: paper
    location: "https://arxiv.org/abs/2402.06603"
    relationship: background
    note: >-
      C-expanders are Hamiltonian; in particular a Cayley graph with a
      uniformly random generating set of size at least C log n is Hamiltonian
      with high probability. Theorem 1.1 concerns every connected Cayley graph
      of the stated degree, not random generating sets.
  - title: "Towards the Lovász conjecture via sublinear expanders"
    authors: ["Matija Bucić", "Micha Christoph", "Alexey Pokrovskiy", "Raphael Steiner"]
    id: "arXiv:2606.09742"
    type: paper
    location: "https://arxiv.org/abs/2606.09742"
    relationship: background
    note: >-
      Long cycles in connected vertex-transitive graphs of arbitrary degree via
      sublinear expanders; context for the Lovász conjecture.
  - title: "Hamiltonicity of mildly pseudorandom regular graphs"
    authors: ["Alp Müyesser"]
    type: other
    location: "Unpublished manuscript (supplied manuscript cited as [6] by the source draft); not publicly available"
    relationship: background
    note: >-
      The source draft states that its local absorption argument (Section 3) is
      an adaptation of this manuscript and that neither the local statement nor
      the Cayley degree bound is asserted there. The formalization follows the
      source draft's version and did not consult this manuscript.
  - title: "Connectivity of transitive graphs"
    authors: ["Mark E. Watkins"]
    id: "doi:10.1016/S0021-9800(70)80005-9"
    type: paper
    location: "https://doi.org/10.1016/S0021-9800(70)80005-9"
    relationship: background
    note: >-
      J. Combinatorial Theory 8 (1970), 23–29. The weak form "vertex
      connectivity at least k/2" used by the source is proved for components of
      Cayley graphs in Lovasz/Watkins.lean.
  - title: "A condition for matchability in hypergraphs"
    authors: ["P. E. Haxell"]
    id: "doi:10.1007/BF01793010"
    type: paper
    location: "https://doi.org/10.1007/BF01793010"
    relationship: background
    note: >-
      Graphs Combin. 11 (1995), 245–248. Proved in Lovasz/Haxell.lean and used
      for Lemma 3.4.
  - title: "A short proof of the tree-packing theorem"
    authors: ["Tomáš Kaiser"]
    id: "arXiv:0911.2809"
    type: paper
    location: "https://arxiv.org/abs/0911.2809"
    relationship: background
    note: >-
      The Nash-Williams–Tutte tree-packing theorem, proved in
      Lovasz/TreePacking.lean following this proof and used for cut counting
      (6.4).
  - title: "A faster exact separation algorithm for blossom inequalities"
    authors: ["Adam N. Letchford", "Gerhard Reinelt", "Dirk Oliver Theis"]
    id: "doi:10.1007/978-3-540-25960-2_15"
    type: paper
    location: "https://doi.org/10.1007/978-3-540-25960-2_15"
    relationship: background
    note: >-
      IPCO 2004, LNCS 3064, 196–205. The source cites it for the description of
      the unit-capacitated perfect b-matching polytope by blossom inequalities,
      proved in Lovasz/BMatchingPolytope.lean and used for Lemma 4.1.
  - title: "Negative association of random variables with applications"
    authors: ["Kumar Joag-Dev", "Frank Proschan"]
    id: "doi:10.1214/aos/1176346079"
    type: paper
    location: "https://doi.org/10.1214/aos/1176346079"
    relationship: background
    note: >-
      Ann. Statist. 11 (1983). Cited by the source for Lemma 6.4; the Lean
      proof (Lovasz/MutualNominations.lean) proves the needed moment inequality
      directly for the nomination model.
  - title: "User-friendly tail bounds for sums of random matrices"
    authors: ["Joel A. Tropp"]
    id: "doi:10.1007/s10208-011-9099-z"
    type: paper
    location: "https://doi.org/10.1007/s10208-011-9099-z"
    relationship: background
    note: >-
      Found. Comput. Math. 12 (2012), 389–434. The source uses matrix Bernstein
      for Lemma 2.2; the formalization derives Lemma 2.2 from the source's own
      Lemma 4.3 instead and does not use this result.
  - title: "Spectral Graph Theory"
    authors: ["Fan R. K. Chung"]
    type: book
    location: "CBMS Regional Conference Series in Mathematics, vol. 92, American Mathematical Society, 1997"
    relationship: background
    note: >-
      The normalized Cheeger inequality, proved in Lovasz/Cheeger.lean and used
      for Lemma 5.1.

related_formalizations: []

status:
  scope: >-
    Fully formalized: Theorem 1.1 of the source, as
    Lovasz.hamiltonian_of_polylog_degree. The statement quantifies over every
    finite group G (in an arbitrary universe) and every finite S with
    S = S^-1 and 1 not in S such that the Cayley graph is connected,
    |G| >= n0, and |S| >= C (log |G|)^13 / log log |G|, and concludes Mathlib's
    SimpleGraph.IsHamiltonian. The whole proof of the source is formalized in
    Lovasz/ as a lemma DAG (docs/BLUEPRINT.md) of about 36,000 lines in 49
    modules, including the classical results the source uses without proof
    (Hall's theorem comes from Mathlib, and matrix Bernstein is avoided).
    Nothing in the source's statement or proof is omitted. The explicit
    constants C and n0 are not extracted: the theorem is existential in them,
    as in the source.
  sorry_count: 0
  sorry_in_definitions: 0
  # Every axiom appearing in `#print axioms` for the main result.
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Lovasz.hamiltonian_of_polylog_degree"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    # Phase 1: the Lean statement and proof development (all of Lovasz/).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Grok Build (xAI command-line coding agent)"
      tool_setup: >-
        AI-generated. A coordinating Claude Opus 5.5 agent wrote the statement
        in Challenge.lean and the sanity lemmas, decomposed the source's proof
        into a lemma DAG (docs/BLUEPRINT.md), stated every node in Lean with a
        sorry and derived the main theorem from its children. It dispatched 38
        Claude Opus 5.5 subagents, up to about 15 at a time: one wrote the
        sanity lemmas, three decomposed the largest nodes (Theorem 3.2 and
        Propositions 5.3 and 6.1) into helper lemmas and proved them from those
        helpers, and the others each proved one node or a small cluster in its
        own file. Every node was checked with
        `lake build` and `#print axioms` before being marked proved. Standard
        Lean/Mathlib tactics only; no external proof-search tools.
      cost:
        wall_time: "About four hours of elapsed time on 2026-09-25 (19:45–23:48 UTC)."
        spend_usd: >-
          About US$285–335 at Anthropic's list prices for Claude Opus 5.5,
          estimated from the session's recorded token counts (about 454 million
          tokens over 1,825 model calls, almost all cached input); actual
          billing depends on the Grok account.
        hardware: "Local Apple Silicon Mac (16 cores, 64 GB) for Lean builds; API-hosted model."
      prompting_notes: >-
        The maintainer set up the Lean project (toolchain, Mathlib pin, the
        source PDF) and the task specification AGENTS.md, and gave one
        instruction: formalize the statement of Theorem 1.1, decompose the
        proof into a lemma DAG, and formalize it along the DAG with parallel
        subagents, autonomously. The maintainer wrote no Lean code and did not
        direct individual proof steps. Subagents were prompted with the paper
        reference, the exact Lean statement of their node, and the rule never
        to change a statement but to report it if false.
    # Phase 2: the Palomar submission surface (no proof content).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Grok Build (xAI command-line coding agent)"
      tool_setup: >-
        At the maintainer's request, the same agent prepared the Palomar
        submission: moved the two statement definitions into
        Lovasz/Statement.lean so that Solution.lean can restate the Challenge
        theorem, added comparator.json, this file, README.md, VERIFICATION.md
        and the CI workflow, ran the toolchain's `lake comparator` locally, and
        ran independent Claude Opus 5.5 subagents on the PalomarPolicy review
        prompts, revising the metadata in response. Adds no proof content.
      cost:
        wall_time: "A few hours of elapsed time on 2026-09-25 and 2026-09-26."
        spend_usd: "not tracked separately"
        hardware: "Local Apple Silicon Mac; API-hosted model."
      prompting_notes: >-
        Directed by the maintainer: prepare the repository for Palomar, with the
        author list and model provenance of the source given by the maintainer.
    # Phase 0 (before the formalization): the source manuscript.
    - method: other
      models: ["GPT 6 Astra (OpenAI)"]
      tool_setup: >-
        Not a Lean phase. The source manuscript docs/Polylog_Cayley.pdf was
        generated by GPT 6 Astra in collaboration with the authors listed in
        project.authors. Recorded here because the source being formalized is
        itself AI-generated.
      cost:
        spend_usd: "not tracked"
        hardware: "API-hosted model."
  spend_usd: "About US$285–335 for phase 1 at list prices (see above); later phases not tracked separately."
  notes: >-
    Agent-executed workflow directed by one human. Shengtong Zhang directed the
    formalization and takes responsibility for it, which is why he is listed in
    project.authors, and is the responsible maintainer of this repository. He
    set up the project and the task specification and instructed the agents,
    but wrote no Lean code, and he is not an author of the source manuscript,
    whose authors are recorded in sources[]. Claude Opus 5.5 agents in Grok
    Build produced all of the Lean code, about 36,500 lines (phases 1 and 2);
    GPT 6 Astra generated the source manuscript with its authors (phase 0).
    Correctness of the proof rests on the Lean kernel and on Comparator's
    independent kernel replays; the statement in Challenge.lean is the audited
    surface. The Lean file headers name the AI agent that wrote the code and the
    human who directed it; the toolchain smoke test Lovasz/Basic.lean (no proof
    content) was written by the maintainer during project setup.

fidelity:
  divergences: >-
    None known in the statement. Modelling choices, each justified in
    FORMALIZATION.md and checked by proved sanity lemmas in Lovasz/Sanity.lean:
    (a) the source's convention S = S^-1 and 1 not in S is the hypothesis
    IsConnectionSet S, and the degree d is S.card, which equals the degree of
    every vertex of the Cayley graph (cayleyGraph_degree); (b) "connected
    Cayley graph" is SimpleGraph.Connected of Mathlib's mulCayley, equivalent
    to the source's convention that S generates G (cayleyGraph_connected_iff);
    (c) log is Real.log, and for n >= 3 log log n > 0 so the threshold is a
    genuine positive real (log_log_pos); the existential n0 means Lean's junk
    values at n <= 2 cannot weaken the statement, and the hypotheses are
    satisfiable for every C and n0 (hypotheses_satisfiable,
    hypotheses_satisfiable_noncomplete); (d) "contains a Hamilton cycle" is
    Mathlib's SimpleGraph.IsHamiltonian, which also counts the one-vertex graph
    as Hamiltonian and K2 as not, immaterial for n >= n0 >= 3
    (isHamiltonian_gives_cycle, small_counterexample); (e) the theorem is
    universe-polymorphic in G. At the level of the proof, the Lean development
    takes a different route from the source's text in a few places without
    weakening any statement; these are listed at the end of docs/BLUEPRINT.md.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (Anthropic): independent subagent runs of the PalomarPolicy review prompts before submission"
  notes: >-
    The proof is machine-checked: `lake build` succeeds, `#print axioms
    Lovasz.hamiltonian_of_polylog_degree` in Solution reports exactly propext,
    Classical.choice and Quot.sound, and the toolchain's `lake comparator`
    (Lean kernel, NanoDa and con-ron) accepts Solution against Challenge
    (VERIFICATION.md). The statement was written and audited against the
    source by the formalizing agent (FORMALIZATION.md), supported by the
    machine-checked sanity lemmas in Lovasz/Sanity.lean. Before submission,
    fresh Claude Opus 5.5 subagents ran the PalomarPolicy review prompts on the
    submitted snapshot. No human has reviewed the Lean statement or proof, and
    the source manuscript has not been refereed.

alignment:
  namespace: "Lovasz"
  statements:
    - source: "Polylog_Cayley.pdf, Theorem 1.1 (Proposed theorem), with the conventions of Section 2"
      lean: "Lovasz.hamiltonian_of_polylog_degree"
      module: "Solution"
      status: proved
      note: >-
        There exist C : ℝ and n0 : ℕ with 0 < C and 0 < n0 such that for every
        finite group G and S : Finset G with IsConnectionSet S, if
        (cayleyGraph S).Connected, n0 <= Fintype.card G, and
        C * log n ^ 13 / log (log n) <= S.card, then
        (cayleyGraph S).IsHamiltonian. Proved in Solution.lean from
        Lovasz.main_proof (Lovasz/Main.lean).

acknowledgements: >-
  Mathlib and the Lean 4 community; the Palomar starter template for the
