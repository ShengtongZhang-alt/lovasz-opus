related_formalizations: []

status:
  scope: >-
    Fully formalized: Theorem 1.1 of the source, as
    Lovasz.hamiltonian_of_polylog_degree. The statement quantifies over every
    finite group G (in an arbitrary universe) and every finite S with
    S = S^-1 and 1 not in S such that the Cayley graph is connected,
    |G| >= n0, and |S| >= C (log |G|)^13 / log log |G|, and concludes Mathlib's
    SimpleGraph.IsHamiltonian. The whole proof of the source is formalized in
    Lovasz/ as a lemma DAG (docs/BLUEPRINT.md) of about 36,500 lines in 49
    modules, including the classical results the source uses without proof
    (Hall's theorem comes from Mathlib, and matrix Bernstein is avoided).
    Nothing in the source's statement or proof is omitted. The explicit
    constants C and n0 are not extracted: the theorem is existential in them,
    as in the source.
  sorry_count: 0
  sorry_in_definitions: 0
  # Every axiom appearing in `#print axioms` for the main result.
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Lovasz.hamiltonian_of_polylog_degree"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    # Phase 1: the Lean statement and proof development (all of Lovasz/).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Grok Build (xAI command-line coding agent)"
      tool_setup: >-
        AI-generated. A coordinating Claude Opus 5.5 agent wrote the statement
        in Challenge.lean and the sanity lemmas, decomposed the source's proof
        into a lemma DAG (docs/BLUEPRINT.md), stated every node in Lean with a
        sorry and derived the main theorem from its children. It dispatched 38
        Claude Opus 5.5 subagents, up to about 15 at a time: one wrote the
        sanity lemmas, three decomposed the largest nodes (Theorem 3.2 and
        Propositions 5.3 and 6.1) into helper lemmas and proved them from those
        helpers, and the others each proved one node or a small cluster in its
        own file. Every node was checked with
        `lake build` and `#print axioms` before being marked proved. Standard
        Lean/Mathlib tactics only; no external proof-search tools.
      cost:
        wall_time: "About four hours of elapsed time on 2026-09-25 (19:45–23:48 UTC)."
        spend_usd: >-
          About US$285–335 at Anthropic's list prices for Claude Opus 5.5,
          estimated from the session's recorded token counts (about 454 million
          tokens over 1,825 model calls, almost all cached input); actual
          billing depends on the Grok account.
        hardware: "Local Apple Silicon Mac (16 cores, 64 GB) for Lean builds; API-hosted model."
      prompting_notes: >-
        The maintainer set up the Lean project (toolchain, Mathlib pin, the
        source PDF) and the task specification AGENTS.md, and gave one
        instruction: formalize the statement of Theorem 1.1, decompose the
        proof into a lemma DAG, and formalize it along the DAG with parallel
        subagents, autonomously. The maintainer wrote no Lean code and did not
        direct individual proof steps. Subagents were prompted with the paper
        reference, the exact Lean statement of their node, and the rule never
        to change a statement but to report it if false.
    # Phase 2: the Palomar submission surface (no proof content).
    - method: agent
      models: ["Claude Opus 5.5 (Anthropic)"]
      framework: "Grok Build (xAI command-line coding agent)"
      tool_setup: >-
        At the maintainer's request, the same agent prepared the Palomar
        submission: moved the two statement definitions into
        Lovasz/Statement.lean so that Solution.lean can restate the Challenge
        theorem, added comparator.json, this file, README.md, VERIFICATION.md
        and the CI workflow, ran the toolchain's `lake comparator` locally, and
        ran independent Claude Opus 5.5 subagents on the PalomarPolicy review
        prompts, revising the metadata in response. Adds no proof content.
      cost:
        wall_time: "A few hours of elapsed time on 2026-09-25 and 2026-09-26."
        spend_usd: "not tracked separately"
        hardware: "Local Apple Silicon Mac; API-hosted model."
      prompting_notes: >-
        Directed by the maintainer: prepare the repository for Palomar, with the
        author list supplied by the maintainer and the account of the source's
        preparation supplied by its authors (README.md).
    # Phase 0 (before the formalization): the source manuscript.
    - method: other
      models: ["GPT 6 Pro (OpenAI)"]
      tool_setup: >-
        Not a Lean phase. The source manuscript docs/Polylog_Cayley.pdf was
        prepared by GPT 6 Pro with significant input from its authors, the six
        researchers recorded in sources[0].authors, including several
        unpublished human manuscripts identified in its bibliography (as stated
        by the authors in README.md; the PDF carries no author line). The
        formalization author in project.authors took no part in it. Recorded
        here because the source being formalized was itself prepared largely by
        an AI model.
      cost:
        spend_usd: "not tracked"
        hardware: "API-hosted model."
  spend_usd: "About US$285–335 for phase 1 at list prices (see above); later phases not tracked separately."
  notes: >-
    Agent-executed workflow directed by one human. Shengtong Zhang directed the
    formalization and takes responsibility for it, which is why he is listed in
    project.authors, and is the responsible maintainer of this repository. He
    set up the project and the task specification and instructed the agents,
    but wrote no Lean code, and he is not an author of the source manuscript,
    whose authors are recorded in sources[]. Claude Opus 5.5 agents in Grok
    Build produced all of the Lean code, about 36,500 lines (phases 1 and 2);
    GPT 6 Pro prepared the source manuscript with significant input from its
    authors (phase 0).
    Correctness of the proof rests on the Lean kernel and on Comparator's
    independent kernel replays; the statement in Challenge.lean is the audited
    surface. The Lean file headers name the AI agent that wrote the code and the
    human who directed it; the toolchain smoke test Lovasz/Basic.lean (no proof
    content) was written by the maintainer during project setup.

fidelity:
  divergences: >-
    None known in the statement. Modelling choices, each justified in
    FORMALIZATION.md and checked by proved sanity lemmas in Lovasz/Sanity.lean:
    (a) the source's convention S = S^-1 and 1 not in S is the hypothesis
    IsConnectionSet S, and the degree d is S.card, which equals the degree of
    every vertex of the Cayley graph (cayleyGraph_degree); (b) "connected
    Cayley graph" is SimpleGraph.Connected of Mathlib's mulCayley, equivalent
    to the source's convention that S generates G (cayleyGraph_connected_iff);
    (c) log is Real.log, and for n >= 3 log log n > 0 so the threshold is a
    genuine positive real (log_log_pos); the existential n0 means Lean's junk
    values at n <= 2 cannot weaken the statement, and the hypotheses are
    satisfiable for every C and n0 (hypotheses_satisfiable,
    hypotheses_satisfiable_noncomplete); (d) "contains a Hamilton cycle" is
    Mathlib's SimpleGraph.IsHamiltonian, which also counts the one-vertex graph
    as Hamiltonian and K2 as not, immaterial for n >= n0 >= 3
    (isHamiltonian_gives_cycle, small_counterexample); (e) the theorem is
    universe-polymorphic in G. At the level of the proof, the Lean development
    takes a different route from the source's text in a few places without
    weakening Theorem 1.1; the only intermediate statement whose form changes
    is Lemma 2.2, where the term c√t (c the largest column norm) gains a
    universal factor and becomes 6c√t, because it is derived from the
    source's Lemma 4.3 instead of matrix Bernstein; the later steps absorb
    the factor. These
    points are listed at the end of docs/BLUEPRINT.md.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (Anthropic): independent subagent runs of the PalomarPolicy review prompts before submission"
  notes: >-
    The proof is machine-checked: `lake build` succeeds, `#print axioms
    Lovasz.hamiltonian_of_polylog_degree` in Solution reports exactly propext,
    Classical.choice and Quot.sound, and the toolchain's `lake comparator`
    (Lean kernel, NanoDa and con-ron) accepts Solution against Challenge
    (VERIFICATION.md). The statement was written and audited against the
    source by the formalizing agent (FORMALIZATION.md), supported by the
    machine-checked sanity lemmas in Lovasz/Sanity.lean. Before submission,
    fresh Claude Opus 5.5 subagents ran the PalomarPolicy review prompts on the
    submitted snapshot. No human has reviewed the Lean statement or proof, and
    the source manuscript has not been refereed.

alignment:
  namespace: "Lovasz"
  statements:
    - source: "Polylog_Cayley.pdf, Theorem 1.1 (Proposed theorem), with the conventions of Section 2"
      lean: "Lovasz.hamiltonian_of_polylog_degree"
      module: "Solution"
      status: proved
      note: >-
        There exist C : ℝ and n0 : ℕ with 0 < C and 0 < n0 such that for every
        finite group G and S : Finset G with IsConnectionSet S, if
        (cayleyGraph S).Connected, n0 <= Fintype.card G, and
        C * log n ^ 13 / log (log n) <= S.card, then
        (cayleyGraph S).IsHamiltonian. Proved in Solution.lean from
        Lovasz.main_proof (Lovasz/Main.lean).

